[package]
name = "please-make-me-an-app"
version = "0.0.0"
edition = "2024"
description = "Turn any website into a desktop app with a YAML config file"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
# png+ico: primary favicon formats. jpeg/gif/webp: some sites (WordPress, PWAs) serve
# favicons in these formats; decoding fails silently if the feature is absent.
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }
notify-rust = "4"
serde_json = "1"
tao = "0.36"
tempfile = "3"
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
ureq = "3"
wry = "0.56"
# Used directly to set the AppIndicator StatusNotifierItem `Title` (tray-icon does
# not expose it). Must match the version tray-icon pulls in (0.9) so cargo
# unifies to a single copy.
libappindicator = "0.9"

[features]
# Forwards to wry's `devtools` feature so `WebView::open_devtools` and friends
# compile in release builds. Enabled by default; the inspector is only wired onto
# the webview when `--debug` is passed (see app.rs).
devtools = ["wry/devtools"]

default = ["devtools"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[lints.rust]
future-incompatible = "warn"
nonstandard-style = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
redundant_clone = "deny"
needless_collect = "warn"
large_enum_variant = "warn"

